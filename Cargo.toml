[package]
name = "session_rust"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde", "fast-rng", "js"] }
once_cell = "1"
parking_lot = "0.12"
rand = "0.8"
libc = "0.2"
inventory = "0.3"
rayon = "1.10"
prost = "0.14"
bytemuck = { version = "1", features = ["derive"] }
wgpu = "29"

# On wasm, wgpu handles are !Send/!Sync. `Mesh` now caches a wgpu::Buffer and must
# stay Send (rayon par_iter over Vec<Mesh>), so promise single-threaded-wasm safety.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "29", features = ["fragile-send-sync-non-atomic-wasm"] }

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3.2"

[dev-dependencies]
pollster = "0.4"

[profile.dev]
opt-level = 0
debug = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
