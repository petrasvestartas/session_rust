[package]
name = "session_rust"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
uuid = { version = "1.0", features = ["v4", "serde", "fast-rng", "js"] }
once_cell = "1"
parking_lot = "0.12"
rand = "0.8"
libc = "0.2"
inventory = "0.3"
rayon = "1.10"
prost = "0.14"
bytemuck = { version = "1", features = ["derive"] }
wgpu = "29"

# PDF import (`--features pdf`). Off by default because mupdf-sys compiles MuPDF's own C sources
# through bindgen/libclang: minutes of build, a system dep, and no wasm32 target. CI builds this
# crate on four platforms with no clang install step, so it must not be a default dependency.
[features]
pdf = ["dep:mupdf", "dep:earcutr"]

# PDF deps are declared ONLY for non-wasm targets, so a wasm32 build cannot pull MuPDF even if
# something enables `pdf` - the viewer is structurally safe rather than relying on flag discipline.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Earcut is what fonts and maps use: ear-clipping with hole bridging, and it does not care that a
# glyph contour touches itself. The kernel CDT fits an average plane and inserts Delaunay
# constraints - correct for trimmed surfaces, but it mis-triangulated 28% of glyph fills here.
earcutr = { version = "0.5", optional = true }
# default-features = false drops system-fonts (font-kit -> fontconfig, a system dev package we do
# not need: a PDF embeds the fonts it uses) plus epub/html/svg/tesseract readers we never open.
# base14-fonts keeps the standard PDF fonts, which a sheet may reference without embedding.
mupdf = { version = "0.8", default-features = false, features = ["base14-fonts"], optional = true }

[[bin]]
name = "pdf_import"
path = "src/bin/pdf_import.rs"
required-features = ["pdf"]

# On wasm, wgpu handles are !Send/!Sync. `Mesh` now caches a wgpu::Buffer and must
# stay Send (rayon par_iter over Vec<Mesh>), so promise single-threaded-wasm safety.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "29", features = ["fragile-send-sync-non-atomic-wasm"] }

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3.2"

[profile.dev]
opt-level = 1
debug = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
