[package]
name = "session_rust"
version = "0.1.0"
edition = "2021"

[features]
default = []
protobuf = ["prost", "prost-build"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
once_cell = "1"
rand = "0.8"
libc = "0.2"
inventory = "0.3"
prost = { version = "0.12", optional = true }

[build-dependencies]
prost-build = { version = "0.12", optional = true }

[dev-dependencies]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
