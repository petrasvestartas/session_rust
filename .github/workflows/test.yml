name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, macos-15-intel, windows-latest]

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Rust toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable

      - name: Cache cargo + target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: rust-${{ matrix.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-${{ matrix.os }}-

      - name: Build
        run: cargo build --lib --bin minitest

      - name: Run minitest
        run: cargo run --bin minitest
